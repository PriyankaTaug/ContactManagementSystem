name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest  # Assuming you have test files using pytest

  deploy:
    needs: test  # Deployment runs only if 'test' job passes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Deploy to PythonAnywhere
        env:
          USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          DOMAIN: "Priya100898.pythonanywhere.com"  # Your PythonAnywhere app domain
        run: |
          echo "Deploying to PythonAnywhere..."
          echo "Username: $USERNAME"
          echo "Domain: $DOMAIN"

          # Trigger PythonAnywhere deployment
          curl -X POST -H "Authorization: Token $API_TOKEN" \
            https://www.pythonanywhere.com/api/v0/user/$USERNAME/webapps/$DOMAIN/reload/

          echo "Deployment trigger sent!"
