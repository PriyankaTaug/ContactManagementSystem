name: Deploy to PythonAnywhere

on:
  push:
    branches:
      - main  # Change this if you're using a different branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'  # Change this if using another version

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Deploy to PythonAnywhere
        env:
          PA_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PA_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
        run: |
          curl -X POST --data "token=$PA_API_TOKEN" "https://www.pythonanywhere.com/api/v0/user/$PA_USERNAME/webapps/reload/"
